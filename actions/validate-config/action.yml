name: Validate workflows and Dependabot config
description: >-
  Lints .github/workflows with actionlint (and shellcheck) and checks .github/dependabot.yml
  against its schema. The one file whose breakage is silent: an invalid dependabot.yml
  disables Dependabot entirely, with no error anywhere.

runs:
  using: composite
  steps:
    - name: actionlint and the Dependabot schema
      shell: bash
      run: |
        set -euo pipefail
        # Both tool versions live next to this file (Dockerfile, requirements.txt), where
        # Dependabot updates them; nothing to bump by hand here.
        image="$(sed -n 's/^FROM[[:space:]]\{1,\}//p' "$GITHUB_ACTION_PATH/Dockerfile" | head -n 1)"
        docker run --rm -v "$PWD:/repo:ro" -w /repo "$image" -color .github/workflows/*.yml

        # Its own venv, so nothing leaks into the Python the job sets up afterwards.
        venv="$(mktemp -d)"
        python3 -m venv "$venv"
        "$venv/bin/pip" install --quiet -r "$GITHUB_ACTION_PATH/requirements.txt"
        "$venv/bin/check-jsonschema" \
          --schemafile https://json.schemastore.org/dependabot-2.0.json .github/dependabot.yml
        rm -rf "$venv"
