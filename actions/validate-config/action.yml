name: Validate workflows
description: >-
  Lints .github/workflows with actionlint (and shellcheck). A workflow that does not parse
  never runs at all, so this is the first step of every CI.

runs:
  using: composite
  steps:
    - name: actionlint
      shell: bash
      run: |
        set -euo pipefail
        # The tool version lives next to this file (Dockerfile), pinned by tag and digest.
        image="$(sed -n 's/^FROM[[:space:]]\{1,\}//p' "$GITHUB_ACTION_PATH/Dockerfile" | head -n 1)"
        docker run --rm -v "$PWD:/repo:ro" -w /repo "$image" -color .github/workflows/*.yml
