name: Feature request
description: An idea or an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        These projects keep a deliberately small scope, so start with the problem rather than the
        solution: it is the part most likely to lead somewhere.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How you imagine it working.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or other approaches you considered.
