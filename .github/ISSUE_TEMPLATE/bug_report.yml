name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. **Security problems do not go here**: use the
        repository's Security tab → *Report a vulnerability*.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release, image tag or commit you are running.
      placeholder: v2.1.4, ghcr.io/kn990x/<name>:2.1, or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How it runs
      options:
        - Docker Compose
        - Docker (other)
        - Installed service (systemd / LaunchAgent)
        - From a clone
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines. Replace tokens, domains, emails and hostnames with placeholders.
      render: text
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host OS and architecture (amd64/arm64), browser if it is a UI problem, and anything in front of it (reverse proxy, tunnel).
