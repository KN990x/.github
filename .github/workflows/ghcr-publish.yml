# Reusable release pipeline for the KN990x images, called from each repository's own
# .github/workflows/ghcr-publish.yml. One pipeline, so every image is released the same way:
#
#   1. The tag matches the version the tree carries (an image labelled 2.1.0 must not
#      contain 2.0.0 — that happened, twice).
#   2. The commit being released already passed that repository's CI. Nothing is re-tested
#      here: the release is the commit CI approved, not a second opinion on it.
#   3. Both architectures are built, loaded and booted by the repository's own smoke test
#      before anything is pushed. arm64 runs under QEMU: slow, but it is the only thing
#      standing between an arm64-only regression and a crash-loop on every Raspberry Pi.
#   4. Only then the multi-arch push, from the same build cache, with provenance and SBOM.
#
# With `push: false` it stops after step 3: that is the monthly dry run each repository
# schedules, so a broken arm64 build shows up weeks before a release needs it.
name: GHCR publish

on:
  workflow_call:
    inputs:
      image:
        description: Image to publish, e.g. ghcr.io/kn990x/easypages.
        type: string
        required: true
      tag:
        description: Release tag (vX.Y.Z). Empty builds and tests the calling commit.
        type: string
        default: ""
      push:
        description: Publish the image and the release assets. False builds and smoke-tests only.
        type: boolean
        default: false
      version-file:
        description: JSON file whose "version" must equal the tag without its v. Empty skips the check.
        type: string
        default: ""
      smoke-script:
        description: "Called as: <script> <image> <container-name> <platform>."
        type: string
        default: .github/scripts/smoke-test.sh
      release-assets:
        description: Space-separated files to attach to the release. A leading dot is dropped from the uploaded name (GitHub would rename .env.example to default.env.example).
        type: string
        default: ""
      ci-workflow:
        description: Workflow file whose successful run on the released commit is required.
        type: string
        default: ci.yml
      require-ci:
        description: Require that successful CI run. Only this repository's own test of the pipeline turns it off.
        type: boolean
        default: true
      context:
        description: Build context (the directory holding the Dockerfile).
        type: string
        default: "."

permissions: {}

jobs:
  build:
    name: Build, smoke-test and push
    runs-on: ubuntu-latest
    # Emulated arm64 is slow enough to be worth bounding explicitly; without this a hung
    # QEMU build sits on the runner for the 6h default.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # publish the image to GHCR
      actions: read # look up the CI run of the released commit
    env:
      IMAGE: ${{ inputs.image }}
      TAG: ${{ inputs.tag }}
      PUSH: ${{ inputs.push }}
      VERSION_FILE: ${{ inputs.version-file }}
      SMOKE_SCRIPT: ${{ inputs.smoke-script }}
      CI_WORKFLOW: ${{ inputs.ci-workflow }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false

      # First on purpose: it needs nothing but jq, and it is the check that has actually
      # failed in the past, so paying for the toolchain before it only delays the verdict.
      - name: Verify the tag matches the version
        run: |
          set -euo pipefail
          if [ "$PUSH" = "true" ] && [ -z "$TAG" ]; then
            echo "::error::Nothing to publish without a release tag." >&2
            exit 1
          fi
          if [ -z "$TAG" ] || [ -z "$VERSION_FILE" ]; then
            echo "No tag or no version file: skipped."
            exit 0
          fi
          version="$(jq -r .version "$VERSION_FILE")"
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error::Release tag ${TAG} does not match ${VERSION_FILE} version ${version}." >&2
            exit 1
          fi
          echo "Version ${version} matches the release tag."

      - name: Verify CI passed on this commit
        if: ${{ inputs.require-ci }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${CI_WORKFLOW}/runs?head_sha=${sha}&status=success&per_page=1" --jq .total_count)"
          if [ "$runs" -eq 0 ]; then
            echo "::error::${CI_WORKFLOW} has no successful run on ${sha}. Release a commit CI approved (or wait for its run to finish)." >&2
            exit 1
          fi
          echo "${CI_WORKFLOW} passed on ${sha}."

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # `load: true` takes one platform at a time, hence one build per architecture. The push
      # below reuses the same GHA cache, so the bytes that reach GHCR are the ones that passed.
      - name: Build amd64 image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/Dockerfile
          platforms: linux/amd64
          tags: release-smoke:amd64
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test amd64
        run: bash "$SMOKE_SCRIPT" release-smoke:amd64 release-smoke-amd64 linux/amd64

      - name: Build arm64 image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/Dockerfile
          platforms: linux/arm64
          tags: release-smoke:arm64
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test arm64
        run: bash "$SMOKE_SCRIPT" release-smoke:arm64 release-smoke-arm64 linux/arm64

      # `latest` only follows the newest release: republishing an older tag (after an
      # Actions outage, say) must not move `latest` back in time.
      - name: Is this the latest release?
        id: latest
        if: ${{ inputs.push }}
        run: |
          set -euo pipefail
          newest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [ "$newest" = "$TAG" ]; then echo "value=true" >> "$GITHUB_OUTPUT"; else echo "value=false" >> "$GITHUB_OUTPUT"; fi
          echo "Newest release: ${newest}; publishing: ${TAG}."

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata (tags, labels)
        id: meta
        if: ${{ inputs.push }}
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=semver,pattern={{major}},value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ steps.latest.outputs.value }}

      # Provenance and SBOM attestations published alongside the image: they let anyone
      # verify which commit and which dependencies it was built from. The image itself is
      # unchanged.
      - name: Build & push
        if: ${{ inputs.push }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  # Split out so `contents: write` is scoped to the one thing that needs it: the build runs
  # the whole Docker toolchain with no ability to alter the release.
  assets:
    name: Attach release assets
    needs: build
    if: ${{ inputs.push && inputs.release-assets != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      ASSETS: ${{ inputs.release-assets }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Upload
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets"
          files=()
          for f in $ASSETS; do
            name="$(basename "$f")"
            cp "$f" "$RUNNER_TEMP/assets/${name#.}"
            files+=("$RUNNER_TEMP/assets/${name#.}")
          done
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
