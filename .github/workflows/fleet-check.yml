# Monthly check of every public KN990x repository that uses Dependabot, in one place, so
# nobody has to open five repositories to know they are healthy. It rewrites a single issue
# here, "Fleet status" (label `fleet`), which is edited in place and so sends no
# notification. Read-only everywhere else: it only uses public data.
name: Fleet check

on:
  schedule:
    # The 1st, 12:00 UTC: after the audits (03:30), the release dry runs (04:30),
    # Dependabot (06:00 Madrid) and the morning's automatic merges.
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  check:
    name: Fleet status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      HERE: ${{ github.repository }}
    steps:
      - name: Rewrite the "Fleet status" issue
        run: |
          python3 - <<'PY'
          import base64, datetime, json, os, re, subprocess

          owner, here = os.environ["OWNER"], os.environ["HERE"]

          def api(path, default=None):
              r = subprocess.run(["gh", "api", path], capture_output=True, text=True)
              return json.loads(r.stdout) if r.returncode == 0 else default

          def paged(path):
              r = subprocess.run(["gh", "api", "--paginate", "--slurp", path], capture_output=True, text=True, check=True)
              return [item for page in json.loads(r.stdout) for item in page]

          def last_run(repo, workflow_file, branch=None):
              q = f"repos/{repo}/actions/workflows/{workflow_file}/runs?per_page=1&status=completed"
              if branch:
                  q += f"&branch={branch}"
              runs = (api(q) or {}).get("workflow_runs", [])
              if not runs:
                  return "—"
              r = runs[0]
              mark = "ok" if r["conclusion"] == "success" else f"**{r['conclusion']}**"
              return f"[{mark}]({r['html_url']}) {r['created_at'][:10]}"

          latest = (api(f"repos/{here}/releases/latest") or {}).get("tag_name", "?")
          now = datetime.datetime.now(datetime.timezone.utc)
          rows, problems = [], []

          repos = [r for r in paged(f"users/{owner}/repos?type=owner&per_page=100")
                   if not r["private"] and not r["archived"]]
          for r in sorted(repos, key=lambda r: r["name"].lower()):
              name, full = r["name"], r["full_name"]
              if api(f"repos/{full}/contents/.github/dependabot.yml") is None:
                  continue
              branch = r["default_branch"]
              workflows = (api(f"repos/{full}/actions/workflows?per_page=100") or {}).get("workflows", [])
              files = {w["path"].rsplit("/", 1)[-1]: w for w in workflows if w["path"].startswith(".github/")}
              disabled = [w["name"] for w in workflows if w["state"] != "active"]

              # Which release of this repository the others pin.
              pins = set()
              for wf in files:
                  content = api(f"repos/{full}/contents/.github/workflows/{wf}")
                  if content:
                      text = base64.b64decode(content["content"]).decode("utf-8", "replace")
                      pins |= set(re.findall(rf"{re.escape(here)}/\S+@[0-9a-f]{{40}} # (v[\d.]+)", text))
              pin = ", ".join(sorted(pins)) if pins else "—"
              if pins and pins != {latest}:
                  pin = f"**{pin}**"

              prs = api(f"repos/{full}/pulls?state=open&per_page=100") or []
              bot = [p for p in prs if p["user"]["login"] == "dependabot[bot]"]
              oldest = max(((now - datetime.datetime.fromisoformat(p["created_at"].replace("Z", "+00:00"))).days for p in bot), default=0)
              prs_cell = f"{len(bot)}" + (f" (oldest {oldest} d)" if bot else "")
              if oldest > 14:
                  prs_cell = f"**{prs_cell}**"

              ci = last_run(full, "ci.yml", branch)
              audit = last_run(full, "security-audit.yml") if "security-audit.yml" in files else "—"
              release = last_run(full, "ghcr-publish.yml") if "ghcr-publish.yml" in files else "—"
              row = [f"[{name}]({r['html_url']})", ci, audit, release, pin, prs_cell,
                     ", ".join(f"**{d}**" for d in disabled) or "none"]
              rows.append("| " + " | ".join(row) + " |")
              if "**" in "".join(row[1:]):
                  problems.append(name)

          body = [
              "Rewritten every month by the `Fleet check` workflow (and on demand). Bold means",
              "something to look at: a failed run, an old pin, a Dependabot PR open for more than",
              "14 days, or a workflow GitHub disabled for inactivity.",
              "",
              f"Latest shared release: **{latest}**.",
              "",
              "| Repository | CI on main | Security audit | Release → GHCR | Shared pin | Dependabot PRs | Disabled workflows |",
              "| --- | --- | --- | --- | --- | --- | --- |",
              *rows,
              "",
              ("**Needs a look:** " + ", ".join(problems)) if problems else "Everything is healthy.",
              "",
              f"_Checked on {now:%Y-%m-%d}._",
          ]
          text = "\n".join(body) + "\n"
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(text)
          with open("body.md", "w") as fh:
              fh.write(text)
          PY
          gh label create fleet --repo "$HERE" --color C5DEF5 \
            --description "Monthly health of every public KN990x repository" --force >/dev/null
          number="$(gh issue list --repo "$HERE" --label fleet --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$HERE" --body-file body.md >/dev/null
            echo "Updated issue #$number"
          else
            gh issue create --repo "$HERE" --title "Fleet status" --label fleet --body-file body.md
          fi
