# Reusable: merges a Dependabot PR once it has BOTH a green CI run and an approval from an
# authorised reviewer (Timón, or KN) on its current head commit — and only if it is routine.
# The reviewer's judgement can only make this stricter: an approval never overrides the
# fixed rules below, so a misleading changelog cannot talk its way into a merge.
#
# Each repository calls it from two events, so the order does not matter:
#   - `workflow_run` of its CI (approval came first, CI finishes after);
#   - `pull_request_review` (CI was already green, approval arrives after).
# It never executes the PR's code: it only reads the PR through the API.
#
# Merged only when ALL of these hold:
#   - opened by dependabot[bot], every commit on it by dependabot[bot], from this repository;
#   - the CI workflow has a successful run on the PR's current head;
#   - the latest review of an authorised reviewer on that exact head is an approval (a
#     rebase invalidates it: the new head needs a new review), and none of them has asked
#     for changes since;
#   - no major in Dependabot's own update metadata (majors go through a human, or through
#     Timón's own PR, never through this);
#   - only dependency files change: manifests and lockfiles; in Dockerfiles only FROM or
#     COPY --from lines; in workflows only `uses:` lines;
#   - not labelled `no-automerge`, and GitHub reports it mergeable.
#
# A merge made with GITHUB_TOKEN starts no push workflows, so CI is dispatched on the
# default branch right after: main is validated after every merge, as after any push.
name: Dependabot merge

on:
  workflow_call:
    inputs:
      ci-workflow:
        description: CI workflow file whose green run is required, and which is dispatched on the default branch after merging.
        type: string
        default: ci.yml
      approvers:
        description: Space-separated GitHub logins whose approval counts. Defaults to the repository owner.
        type: string
        default: ""

permissions: {}

jobs:
  merge:
    name: Merge if approved and routine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # merge
      pull-requests: write # merge and delete the branch
      actions: write # dispatch CI on the default branch
    steps:
      - name: Decide and merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          # workflow_run
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          # pull_request_review
          REVIEW_PR: ${{ github.event.pull_request.number }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          APPROVERS: ${{ inputs.approvers }}
        run: |
          python3 - <<'PY'
          # --- decision (tested in this repository's CI against canned API answers) ---
          import json, os, re, subprocess, sys, time

          env = os.environ
          repo = env["REPO"]
          approvers = set((env.get("APPROVERS") or env["OWNER"]).split())
          summary = open(env.get("GITHUB_STEP_SUMMARY") or os.devnull, "a")

          def gh(*args):
              return subprocess.run(["gh", *args], check=True, capture_output=True, text=True).stdout

          def api(path):
              return json.loads(gh("api", path))

          def done(message):
              print(message)
              summary.write(message + "\n")
              sys.exit(0)

          if env["EVENT_NAME"] == "workflow_run":
              if env.get("RUN_CONCLUSION") != "success":
                  done("CI did not pass: nothing to merge.")
              prs = json.loads(env.get("RUN_PRS") or "[]")
              if len(prs) != 1:
                  done(f"The CI run belongs to {len(prs)} pull requests: left alone.")
              number = prs[0]["number"]
          elif env["EVENT_NAME"] == "pull_request_review":
              number = int(env["REVIEW_PR"])
          else:
              done(f"Unexpected event {env['EVENT_NAME']}.")

          pr = api(f"repos/{repo}/pulls/{number}")
          head = pr["head"]["sha"]
          if pr["state"] != "open":
              done(f"#{number} is not open.")
          if pr["user"]["login"] != "dependabot[bot]":
              done(f"#{number} was not opened by Dependabot.")
          if pr["head"]["repo"]["full_name"] != repo:
              done(f"#{number} comes from another repository.")
          if any(label["name"] == "no-automerge" for label in pr["labels"]):
              done(f"#{number} is labelled no-automerge.")

          runs = api(f"repos/{repo}/actions/workflows/{env['CI_WORKFLOW']}/runs?head_sha={head}&status=success&per_page=1")
          if runs["total_count"] == 0:
              done(f"#{number}: no green {env['CI_WORKFLOW']} run on {head[:7]} yet.")

          # The latest review of each authorised reviewer on the current head decides.
          latest = {}
          for review in api(f"repos/{repo}/pulls/{number}/reviews?per_page=100"):
              login = (review.get("user") or {}).get("login")
              if login in approvers and review["state"] in ("APPROVED", "CHANGES_REQUESTED", "DISMISSED"):
                  latest[login] = review
          if any(r["state"] == "CHANGES_REQUESTED" for r in latest.values()):
              done(f"#{number}: a reviewer asked for changes.")
          if not any(r["state"] == "APPROVED" and r["commit_id"] == head for r in latest.values()):
              done(f"#{number}: waiting for an approval on {head[:7]} from {', '.join(sorted(approvers))}.")

          commits = api(f"repos/{repo}/pulls/{number}/commits?per_page=100")
          if any((c.get("author") or {}).get("login") != "dependabot[bot]" for c in commits):
              done(f"#{number} has commits that are not Dependabot's: a human decides.")
          metadata = "\n".join(c["commit"]["message"] for c in commits)
          update_types = set(re.findall(r"update-type:\s*version-update:semver-(\w+)", metadata))
          if "major" in update_types:
              done(f"#{number} includes a major update: it goes through a human or Timón's own PR.")

          plain = {"package.json", "pnpm-lock.yaml", "pyproject.toml", "requirements.txt"}
          files = api(f"repos/{repo}/pulls/{number}/files?per_page=100")
          for f in files:
              path = f["filename"]
              name = path.rsplit("/", 1)[-1]
              changed = [l[1:] for l in (f.get("patch") or "").splitlines()
                         if l[:1] in "+-" and not l.startswith(("+++", "---"))]
              if name in plain:
                  continue
              if name == "Dockerfile":
                  ok = all(re.match(r"\s*(FROM|COPY\s+--from=)", l, re.I) for l in changed)
              elif re.match(r"\.github/workflows/[^/]+\.ya?ml$", path):
                  ok = all(re.match(r"\s*(-\s+)?uses:", l) for l in changed)
              else:
                  ok = False
              if not ok or not changed:
                  done(f"#{number} changes {path} beyond a dependency bump: a human decides.")
          if not update_types and not all(f["filename"].endswith("Dockerfile") for f in files):
              done(f"#{number} carries no update metadata: a human decides.")

          # `mergeable` is computed lazily; ask a few times before giving up.
          for _ in range(6):
              pr = api(f"repos/{repo}/pulls/{number}")
              if pr["mergeable"] is not None:
                  break
              time.sleep(int(env.get("MERGEABLE_WAIT", "10")))
          if pr["mergeable"] is not True:
              done(f"#{number} is not mergeable ({pr['mergeable_state']}).")

          gh("pr", "merge", str(number), "--repo", repo, "--merge", "--delete-branch",
             "--match-head-commit", head)
          gh("workflow", "run", env["CI_WORKFLOW"], "--repo", repo, "--ref", env["DEFAULT_BRANCH"])
          kinds = ", ".join(sorted(update_types)) or "digest"
          done(f"Merged #{number} ({pr['title']}; {kinds}), approved on {head[:7]}, "
               f"and dispatched {env['CI_WORKFLOW']} on {env['DEFAULT_BRANCH']}.")
          PY
