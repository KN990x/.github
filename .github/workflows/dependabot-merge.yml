# Reusable: merges a Dependabot PR once its CI has passed, if and only if it is routine.
# Each repository calls it from a `workflow_run` of its CI, so it runs after the check it
# relies on, on the default branch, and never executes the PR's code — it only reads the PR
# through the API.
#
# Merged only when ALL of these hold; anything else is left for a human (or Timón):
#   - opened by dependabot[bot], every commit on it by dependabot[bot], from this repository;
#   - the CI run that triggered this is for the PR's current head (nothing pushed since);
#   - no major in Dependabot's own update metadata. A security major is left alone too;
#   - only dependency files change: manifests and lockfiles; in Dockerfiles, only FROM or
#     COPY --from lines; in workflows, only `uses:` lines;
#   - not labelled `no-automerge`, and GitHub reports it mergeable.
#
# A merge made with GITHUB_TOKEN starts no push workflows, so CI is dispatched on the
# default branch right after: main is validated after every merge, as after any push.
name: Dependabot merge

on:
  workflow_call:
    inputs:
      ci-workflow:
        description: CI workflow file to dispatch on the default branch after merging.
        type: string
        default: ci.yml

permissions: {}

jobs:
  merge:
    name: Merge if routine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # merge
      pull-requests: write # merge and delete the branch
      actions: write # dispatch CI on the default branch
    steps:
      - name: Decide and merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys, time

          repo = os.environ["REPO"]
          head_sha = os.environ["HEAD_SHA"]
          summary = open(os.environ["GITHUB_STEP_SUMMARY"], "a")

          def gh(*args):
              return subprocess.run(["gh", *args], check=True, capture_output=True, text=True).stdout

          def api(path):
              return json.loads(gh("api", path))

          def done(message):
              print(message)
              summary.write(message + "\n")
              sys.exit(0)

          if os.environ["RUN_EVENT"] != "pull_request" or os.environ["RUN_CONCLUSION"] != "success":
              done("Not a successful pull_request CI run: nothing to do.")
          prs = json.loads(os.environ["RUN_PRS"] or "[]")
          if len(prs) != 1:
              done(f"The CI run belongs to {len(prs)} pull requests: left alone.")
          number = prs[0]["number"]

          pr = api(f"repos/{repo}/pulls/{number}")
          if pr["state"] != "open":
              done(f"#{number} is not open.")
          if pr["user"]["login"] != "dependabot[bot]":
              done(f"#{number} was not opened by Dependabot.")
          if pr["head"]["repo"]["full_name"] != repo:
              done(f"#{number} comes from another repository.")
          if pr["head"]["sha"] != head_sha:
              done(f"#{number} moved on since this CI run; the run for its new head decides.")
          if any(label["name"] == "no-automerge" for label in pr["labels"]):
              done(f"#{number} is labelled no-automerge.")

          commits = api(f"repos/{repo}/pulls/{number}/commits?per_page=100")
          if any((c.get("author") or {}).get("login") != "dependabot[bot]" for c in commits):
              done(f"#{number} has commits that are not Dependabot's: a human decides.")
          metadata = "\n".join(c["commit"]["message"] for c in commits)
          update_types = set(re.findall(r"update-type:\s*version-update:semver-(\w+)", metadata))
          if "major" in update_types:
              done(f"#{number} includes a major update: a human decides.")

          # Dependency files only. For Dockerfiles and workflows, every changed line must be
          # a base-image or `uses:` line: anything else is not a dependency bump.
          plain = {"package.json", "pnpm-lock.yaml", "pyproject.toml", "requirements.txt"}
          files = api(f"repos/{repo}/pulls/{number}/files?per_page=100")
          for f in files:
              path = f["filename"]
              name = path.rsplit("/", 1)[-1]
              changed = [l[1:] for l in (f.get("patch") or "").splitlines()
                         if l[:1] in "+-" and not l.startswith(("+++", "---"))]
              if name in plain:
                  continue
              if name == "Dockerfile":
                  ok = all(re.match(r"\s*(FROM|COPY\s+--from=)", l, re.I) for l in changed)
              elif re.match(r"\.github/workflows/[^/]+\.ya?ml$", path):
                  ok = all(re.match(r"\s*(-\s+)?uses:", l) for l in changed)
              else:
                  ok = False
              if not ok or not changed:
                  done(f"#{number} changes {path} beyond a dependency bump: a human decides.")
          if not update_types and not all(f["filename"].endswith("Dockerfile") for f in files):
              done(f"#{number} carries no update metadata: a human decides.")

          # `mergeable` is computed lazily; ask a few times before giving up.
          for _ in range(6):
              pr = api(f"repos/{repo}/pulls/{number}")
              if pr["mergeable"] is not None:
                  break
              time.sleep(10)
          if pr["mergeable"] is not True:
              done(f"#{number} is not mergeable ({pr['mergeable_state']}).")

          gh("pr", "merge", str(number), "--repo", repo, "--merge", "--delete-branch",
             "--match-head-commit", head_sha)
          gh("workflow", "run", os.environ["CI_WORKFLOW"], "--repo", repo,
             "--ref", os.environ["DEFAULT_BRANCH"])
          kinds = ", ".join(sorted(update_types)) or "digest"
          done(f"Merged #{number} ({pr['title']}; {kinds}) and dispatched "
               f"{os.environ['CI_WORKFLOW']} on {os.environ['DEFAULT_BRANCH']}.")
          PY
