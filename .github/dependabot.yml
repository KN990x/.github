# Same policy as the repositories that use this one: monthly, grouped, a 7-day cooldown, and
# security updates in their own group.
version: 2
updates:
  # Covers the reusable workflows. The composite actions call no other action, so there is
  # nothing to update under actions/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      actions:
        applies-to: version-updates
        patterns:
          - "*"
